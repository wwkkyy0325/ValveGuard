name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v1.0.0"
        required: true
      model_url:
        description: "Optional ONNX bundle zip URL (overrides the repository variable)"
        required: false

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows release
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop-ui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            desktop -> target
            desktop-ui/src-tauri -> target

      - name: Fetch ONNX model bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "${{ inputs.model_url }}"
          if ([string]::IsNullOrWhiteSpace($url)) {
            $url = "${{ vars.VALVEGUARD_MODEL_URL }}"
          }
          if ([string]::IsNullOrWhiteSpace($url)) {
            $url = "https://github.com/${{ github.repository }}/releases/download/model-v1/valveguard_cnn_v1_onnx.zip"
          }
          Write-Host "Model bundle: $url"
          Invoke-WebRequest -Uri $url -OutFile model.zip

          $expected = "${{ vars.VALVEGUARD_MODEL_SHA256 }}"
          if (-not [string]::IsNullOrWhiteSpace($expected)) {
            $actual = (Get-FileHash model.zip -Algorithm SHA256).Hash.ToLower()
            if ($actual -ne $expected.ToLower()) {
              throw "Model bundle SHA256 mismatch: $actual"
            }
            Write-Host "Model SHA256 verified: $actual"
          }

          Expand-Archive -Path model.zip -DestinationPath artifacts/valveguard_cnn_v1_onnx -Force
          Copy-Item model.zip artifacts/valveguard_cnn_v1_onnx.zip -Force

          $required = @(
            "model.onnx",
            "manifest.json",
            "channel_names.json",
            "human_player_scores.json",
            "reference.npz",
            "reference.json"
          )
          foreach ($name in $required) {
            $path = "artifacts/valveguard_cnn_v1_onnx/$name"
            if (-not (Test-Path $path)) {
              throw "Model bundle is missing $name"
            }
          }

      - name: Install frontend dependencies
        working-directory: desktop-ui
        run: npm ci

      - name: Build installers
        working-directory: desktop-ui
        run: npm run tauri build -- --bundles nsis,msi

      - name: Build portable zip
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $portable = "dist/portable"
          Remove-Item -Recurse -Force $portable -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force "$portable/model" | Out-Null
          Copy-Item "desktop-ui/src-tauri/target/release/valveguard-desktop-ui.exe" "$portable/ValveGuard.exe"
          Copy-Item "artifacts/valveguard_cnn_v1_onnx/*" "$portable/model/"
          Copy-Item "desktop-ui/README.md" "$portable/README.txt"
          Compress-Archive -Path "$portable/*" -DestinationPath "artifacts/valveguard-desktop-v1-win64.zip" -Force

      - name: Write checksums
        shell: pwsh
        run: |
          $files = @(
            "artifacts/valveguard_cnn_v1_onnx.zip",
            "artifacts/valveguard-desktop-v1-win64.zip"
          )
          $files += Get-ChildItem "desktop-ui/src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty FullName
          $files += Get-ChildItem "desktop-ui/src-tauri/target/release/bundle/msi/*.msi" -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty FullName

          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
            "$hash  $(Split-Path $file -Leaf)"
          }
          $lines | Set-Content artifacts/SHA256SUMS.txt -Encoding utf8
          Get-Content artifacts/SHA256SUMS.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ValveGuard ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/valveguard_cnn_v1_onnx.zip
            artifacts/valveguard-desktop-v1-win64.zip
            artifacts/SHA256SUMS.txt
            desktop-ui/src-tauri/target/release/bundle/nsis/*.exe
            desktop-ui/src-tauri/target/release/bundle/msi/*.msi
